services:
  db:
    image: postgres:17-alpine
    container_name: sabemi-webhooks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabemi_webhooks}
      POSTGRES_USER: ${POSTGRES_USER:-sabemi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabemi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - sabemi_webhooks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabemi} -d ${POSTGRES_DB:-sabemi_webhooks}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sabemi_webhooks_pgdata:
