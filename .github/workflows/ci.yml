name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sabemi_webhooks_tests
          POSTGRES_USER: sabemi
          POSTGRES_PASSWORD: sabemi_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sabemi -d sabemi_webhooks_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/Sabemi.Webhooks.slnx

      - name: Build
        run: dotnet build backend/Sabemi.Webhooks.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Sabemi.Webhooks.slnx --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build
